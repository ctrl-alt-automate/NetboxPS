# docker-compose.ci.yml
# ======================
# Lightweight Netbox stack for CI/CD integration testing
#
# Usage:
#   # Start with default version (4.4.9)
#   docker compose -f docker-compose.ci.yml up -d
#
#   # Start with specific version
#   NETBOX_VERSION=v4.5.0-3.2.0 docker compose -f docker-compose.ci.yml up -d
#
#   # Stop and cleanup
#   docker compose -f docker-compose.ci.yml down -v
#
# Default credentials (CI/CD only - NOT for production!):
#   URL:       http://localhost:8000
#   Username:  admin
#   Password:  admin
#   API Token: netbox-docker <= 3.x (Netbox <= 4.4): v1 token
#                0123456789abcdef0123456789abcdef01234567  (Authorization: Token ...)
#              netbox-docker 4.0.x (Netbox 4.5): v2 token with a RANDOM key -> read it from
#                the container log, or let the workflow create one dynamically
#              netbox-docker 5.0.2+ (Netbox 4.6.10 / 4.7+): deterministic v2 token built from
#                SUPERUSER_API_KEY + SUPERUSER_API_TOKEN:
#                nbt_powernetbox1.0123456789abcdef0123456789abcdef01234567  (Authorization: Bearer ...)
#
# Token provisioning changes across netbox-docker releases:
#   - <= 3.x : SUPERUSER_API_TOKEN creates a v1 legacy token
#   - 4.0.x  : SUPERUSER_API_TOKEN creates a v2 token (key auto-generated, so not predictable)
#   - 5.0.2+ : a v2 token is created ONLY when both SUPERUSER_API_KEY (12 chars) and
#              SUPERUSER_API_TOKEN (40 chars) are set; v1 tokens are no longer provisioned
#   - The workflows try the v1 token, then the deterministic v2 token, then create one dynamically
#
# Note: This configuration is optimized for fast startup in CI environments.
#       Do NOT use these credentials or settings in production.

services:
  # ==========================================================================
  # PostgreSQL Database
  # ==========================================================================
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: netbox
      POSTGRES_PASSWORD: netbox
      POSTGRES_DB: netbox
    volumes:
      - netbox-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netbox -d netbox"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - netbox-network
    restart: unless-stopped

  # ==========================================================================
  # Redis - Task Queue
  # ==========================================================================
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - netbox-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - netbox-network
    restart: unless-stopped

  # ==========================================================================
  # Redis - Cache
  # ==========================================================================
  redis-cache:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - netbox-network
    restart: unless-stopped

  # ==========================================================================
  # Netbox Application
  # ==========================================================================
  netbox:
    image: netboxcommunity/netbox:${NETBOX_VERSION:-v4.4.9-3.4.2}
    # Override user setting for CI compatibility (4.5.0+ uses 'unit:root' which may not exist)
    user: ""
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    environment:
      # ----------------------------------------------------------------------
      # Database Configuration
      # ----------------------------------------------------------------------
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: netbox
      DB_USER: netbox
      DB_PASSWORD: netbox

      # ----------------------------------------------------------------------
      # Redis Configuration
      # ----------------------------------------------------------------------
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DATABASE: "0"
      REDIS_CACHE_HOST: redis-cache
      REDIS_CACHE_PORT: "6379"
      REDIS_CACHE_DATABASE: "1"

      # ----------------------------------------------------------------------
      # Security Settings (CI/CD only!)
      # ----------------------------------------------------------------------
      # WARNING: These are insecure defaults for testing only!
      SECRET_KEY: "ci-test-secret-key-not-for-production-use-only-do-not-reuse-ever-minimum-50-chars-required"
      ALLOWED_HOSTS: "localhost,127.0.0.1"
      CORS_ORIGIN_ALLOW_ALL: "false"

      # Netbox 4.5.0+ requires pepper for v2 token HMAC validation (min 50 chars)
      API_TOKEN_PEPPER_1: "ci-pepper-not-for-production-use-only-for-testing-must-be-at-least-50-characters"

      # ----------------------------------------------------------------------
      # Superuser Auto-Creation
      # ----------------------------------------------------------------------
      # Creates admin user with known credentials for testing
      SUPERUSER_NAME: admin
      SUPERUSER_EMAIL: admin@example.com
      SUPERUSER_PASSWORD: admin
      SUPERUSER_API_TOKEN: "0123456789abcdef0123456789abcdef01234567"
      # netbox-docker 5.0.2+ combines this 12-char key with the token above into a deterministic
      # v2 token: nbt_powernetbox1.0123456789abcdef0123456789abcdef01234567 (older images ignore it)
      SUPERUSER_API_KEY: "powernetbox1"
      SKIP_SUPERUSER: "false"

      # ----------------------------------------------------------------------
      # Performance / CI Optimization
      # ----------------------------------------------------------------------
      # Skip non-essential startup tasks for faster boot
      SKIP_STARTUP_SCRIPTS: "false"

      # Disable metrics collection
      METRICS_ENABLED: "false"

      # Reduce logging verbosity
      LOGLEVEL: "WARNING"

    ports:
      - "8000:8080"
    healthcheck:
      # Use /login/ endpoint - doesn't require auth and returns 200
      test: ["CMD", "curl", "-sf", "http://localhost:8080/login/"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s  # Netbox needs time for DB migrations on first run
    networks:
      - netbox-network
    restart: unless-stopped

# ==========================================================================
# Volumes - Persist data between restarts (but not between CI runs)
# ==========================================================================
volumes:
  netbox-postgres-data:
  netbox-redis-data:

# ==========================================================================
# Network - Isolated bridge network for the stack
# ==========================================================================
networks:
  netbox-network:
    driver: bridge
